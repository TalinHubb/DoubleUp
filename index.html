<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <img src="images/header.jpg" class="hero-img" alt="Store Banner">
  </div>
</header>

<div class="header-actions">
  <button onclick="toggleCart()">🛒 Cart</button>
</div>

<nav>
  <a href="#" onclick="filterCategory('cigarettes'); return false;">Cigarettes</a>
  <a href="#" onclick="filterCategory('cigars'); return false;">Cigars</a>
  <a href="#" onclick="filterCategory('flower'); return false;">Flower</a>
  <a href="#" onclick="filterCategory('vapes'); return false;">Vapes</a>
  <a href="#" onclick="filterCategory('liquids'); return false;">E-Liquids</a>
  <a href="#" onclick="filterCategory('accessories'); return false;">Accessories</a>
</nav>

<div class="container">
  <h2>Products</h2>
  <div class="products" id="product-list"></div>
</div>

<div class="cart" id="cart">
  <h2>Cart</h2>
  <ul id="cart-items"></ul>
  <p>Total: $<span id="total">0</span></p>

  <h3>Loyalty Program</h3>
  <input type="text" id="phone" placeholder="Enter phone number" />

  <button onclick="checkout()">Checkout (Pickup)</button>
</div>

<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<script src="products.js"></script>
<script src="script.js"></script>
</body>
</html>
